name: Kazumi Cloud Keep-Alive

on:
  schedule:
    # Run every 10 minutes to keep cloud service awake
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  ping-space:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cloud Service
        run: |
          echo "🌸 Pinging Kazumi Cloud to prevent sleep..."
          if [ -n "${{ secrets.RENDER_APP_URL }}" ]; then
            curl -sS -o /dev/null -w "Render Secret HTTP Status: %{http_code}\n" "${{ secrets.RENDER_APP_URL }}/api/bot-status" || true
          fi
          curl -sS -o /dev/null -w "Render Default HTTP Status: %{http_code}\n" "https://kazumi-companion.onrender.com/api/bot-status" || true
          echo "🌸 Keep-alive ping complete! Kazumi is awake and active."
